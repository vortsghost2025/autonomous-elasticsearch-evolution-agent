<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Master Control Panel</title>
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    .container { max-width: 800px; margin: 40px auto; background: #1e293b; border-radius: 12px; box-shadow: 0 8px 32px #0008; padding: 32px; }
    h1 { font-size: 2.2rem; color: #7c3aed; text-align: center; margin-bottom: 10px; }
    .subtitle { color: #64748b; text-align: center; margin-bottom: 30px; }
    #chat-log { background: #111827; border-radius: 8px; min-height: 220px; max-height: 320px; overflow-y: auto; padding: 16px; margin-bottom: 18px; font-size: 1.1rem; }
    .msg { margin-bottom: 10px; }
    .msg.you { color: #7c3aed; font-weight: 600; }
    .msg.agent { color: #10b981; font-weight: 600; }
    .msg.system { color: #f59e0b; font-style: italic; }
    .controls { display: flex; gap: 10px; margin-bottom: 12px; }
    select, input { padding: 10px; border-radius: 6px; border: 1px solid #64748b; font-size: 1rem; background: #0f172a; color: #f8fafc; }
    button { padding: 10px 20px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
    button:hover { background: #7c3aed; }
    .agent-list { margin-bottom: 18px; }
    .agent-tag { display: inline-block; background: #2563eb; color: #fff; border-radius: 4px; padding: 2px 10px; margin-right: 8px; font-size: 0.95rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Agent Master Control Panel</h1>
    <div class="subtitle">Orchestrate, chat, and command your AI agents in real time</div>
    <div class="agent-list" id="agent-list"></div>
    <div class="controls">
      <label for="agent-select" style="font-weight:600;color:#7c3aed;">Target:</label>
      <select id="agent-select"></select>
      <input id="chat-input" type="text" placeholder="Type a command or message..." style="flex:1;" />
      <button id="send-btn">Send</button>
    </div>
    <div id="chat-log"></div>
  </div>
  <script>
    // --- Config ---
    const AGENTS = [
      { id: 'optimizer', name: 'Optimizer' },
      { id: 'research', name: 'Research Agent' },
      { id: 'coding', name: 'Coding Agent' },
      { id: 'ml', name: 'ML Predictor' },
      { id: 'simulation', name: 'Simulation Engine' }
    ];
    // --- UI Setup ---
    const agentSelect = document.getElementById('agent-select');
    const agentList = document.getElementById('agent-list');
    AGENTS.forEach(a => {
      const opt = document.createElement('option');
      opt.value = a.id; opt.textContent = a.name;
      agentSelect.appendChild(opt);
      const tag = document.createElement('span');
      tag.className = 'agent-tag'; tag.textContent = a.name;
      agentList.appendChild(tag);
    });
    const chatLog = document.getElementById('chat-log');
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    function addChatMessage(agent, message, who) {
      const div = document.createElement('div');
      div.className = 'msg ' + (who || 'system');
      div.innerHTML = `<span>${who === 'you' ? 'You' : agent}:</span> <span>${message}</span>`;
      chatLog.appendChild(div);
      chatLog.scrollTop = chatLog.scrollHeight;
    }
    // --- WebSocket ---
    const ws = new WebSocket(`ws://${window.location.host}`);
    ws.onopen = () => addChatMessage('System', 'Connected to agent network.', 'system');
    ws.onclose = () => addChatMessage('System', 'Disconnected from agent network.', 'system');
    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.type === 'agent-message') {
        addChatMessage(data.agent, data.message, 'agent');
      }
      if (data.type === 'system') {
        addChatMessage('System', data.message, 'system');
      }
    };
    sendBtn.onclick = () => {
      const msg = chatInput.value.trim();
      if (!msg) return;
      const agent = agentSelect.value;
      addChatMessage(agent, msg, 'you');
      ws.send(JSON.stringify({ type: 'agent-command', agent, message: msg }));
      chatInput.value = '';
    };
    chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendBtn.onclick(); });
  </script>
</body>
</html>
